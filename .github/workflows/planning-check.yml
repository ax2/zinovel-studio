name: Development checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-project.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pdf-qa.txt
      - run: pnpm check
      - run: node scripts/check-upstream.mjs
      - run: pnpm build
      - run: node scripts/smoke-harness.mjs
      - run: node scripts/smoke-novel-agent.mjs
      - run: pnpm test:tool-isolation
      - run: pnpm test:desktop
        env:
          ZINOVEL_QA_VIEWPORT: ci
      - run: node scripts/smoke-library.mjs
      - run: pnpm test:editor-tools
      - run: pnpm test:recovery
      - run: pnpm test:merge
      - run: pnpm test:shelf
      - run: pnpm test:writing-views
      - run: pnpm test:tasks
      - run: pnpm test:acceptance
      - run: pnpm test:task-compatibility
      - run: pnpm test:stream
      - run: pnpm test:budget
      - run: pnpm test:candidate-review
      - run: pnpm test:materials
      - run: pnpm test:evidence
      - run: pnpm test:material-context
      - run: pnpm test:material-proposal
      - run: pnpm test:planning-ui
      - run: pnpm test:world-proposals
      - run: pnpm test:pilots
      - run: pnpm test:pilot-agent
      - run: pnpm test:continuity
      - run: pnpm test:relationships
      - run: pnpm test:knowledge
      - run: pnpm test:knowledge-choices
      - run: pnpm test:knowledge-legacy
      - run: pnpm test:knowledge-creation
      - run: pnpm test:knowledge-context
      - run: pnpm test:creative-journey
      - run: pnpm test:reader
      - run: pnpm test:utf8-integrity
      - run: pnpm test:offline-writing
      - run: pnpm test:backup-boundary
      - run: pnpm test:backup-vault
      - run: pnpm test:diagnostics
      - run: pnpm test:model-credentials
      - run: pnpm test:publication-foundation
      - run: pnpm test:publication-capture
      - run: pnpm test:publication-ui
      - run: pnpm test:publication-resources
      - run: pnpm test:pdf-layout
      - run: pnpm test:docx-layout
      - run: pnpm test:assets
      - run: pnpm test:maps-ipc
      - run: pnpm test:maps-ui
      - run: pnpm test:atlas-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-desktop-failure
          path: screenshots/
