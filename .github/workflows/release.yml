name: Windows release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require qualification for the selected release channel
        run: node scripts/check-release-ready.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Check version and release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          if (!(Test-Path "iterations/releases/v$version.md")) { throw 'Missing version release notes' }
          # A future stable release needs a separate, reviewed acceptance gate.
          if ($version -notmatch '-(alpha|beta|rc)\.') { throw 'Stable-release qualification is not yet configured' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pdf-qa.txt
      - run: pnpm check
      - run: node scripts/check-upstream.mjs
      - run: pnpm build
      - run: pnpm test:model-profiles
        env:
          ZINOVEL_PROFILE_START_NARROW: '1'
      - run: pnpm test:agent
      - run: pnpm test:tool-isolation
      - run: pnpm test:library
      - run: pnpm test:editor-tools
      - run: pnpm test:recovery
      - run: pnpm test:merge
      - run: pnpm test:shelf
      - run: pnpm test:writing-views
      - run: pnpm test:tasks
      - run: pnpm test:acceptance
      - run: pnpm test:task-compatibility
      - run: pnpm test:stream
      - run: pnpm test:budget
      - run: pnpm test:candidate-review
      - run: pnpm test:materials
      - run: pnpm test:evidence
      - run: pnpm test:material-context
      - run: pnpm test:material-proposal
      - run: pnpm test:planning-ui
      - run: pnpm test:scene-tree
        env:
          ZINOVEL_TREE_START_COMPACT: '1'
      - run: pnpm test:world-proposals
      - run: pnpm test:pilots
      - run: pnpm test:pilot-agent
      - run: pnpm test:continuity
      - run: pnpm test:relationships
      - run: pnpm test:knowledge
      - run: pnpm test:knowledge-choices
      - run: pnpm test:knowledge-legacy
      - run: pnpm test:knowledge-creation
      - run: pnpm test:knowledge-context
      - run: pnpm test:creative-journey
      - run: pnpm test:reader
      - run: pnpm test:utf8-integrity
      - run: pnpm test:offline-writing
      - run: pnpm test:backup-boundary
      - run: pnpm test:backup-vault
      - run: pnpm test:diagnostics
      - run: pnpm test:model-credentials
      - run: pnpm test:publication-foundation
      - run: pnpm test:publication-capture
      - run: pnpm test:publication-ui
      - run: pnpm test:publication-resources
      - run: pnpm test:pdf-layout
      - run: pnpm test:docx-layout
      - run: pnpm test:assets
      - run: pnpm test:character-looks
      - run: pnpm test:image-studio
      - run: pnpm test:maps-ipc
      - run: pnpm test:maps-ui
      - run: pnpm test:atlas-ui
      - run: pnpm package:win
      - name: Verify packaged image decoder, native DLLs and retained notices
        run: node scripts/verify-image-package.mjs
      - name: Install, run packaged Harness, reinstall and uninstall
        run: pnpm test:installer
      - name: Fetch previous qualified installer and verify real version upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/upgrade-source | Out-Null
          gh release download v0.1.0-alpha.3 --repo ax2/zinovel-studio --pattern '*-setup.exe' --pattern release-manifest.json --dir .cache/upgrade-source
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
          pnpm test:upgrade .cache/upgrade-source/ZiNovel-Studio-0.1.0-alpha.3-windows-x64-setup.exe .cache/upgrade-source/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Cross-version upgrade failed' }
      - name: Upgrade actual public alpha.31 image profiles and pending candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/recent-upgrade-source | Out-Null
          gh release download v0.1.0-alpha.31 --repo ax2/zinovel-studio --pattern '*-setup.exe' --pattern release-manifest.json --dir .cache/recent-upgrade-source
          if ($LASTEXITCODE -ne 0) { throw 'Recent public release download failed' }
          node scripts/smoke-recent-upgrade.mjs .cache/recent-upgrade-source/ZiNovel-Studio-0.1.0-alpha.31-windows-x64-setup.exe .cache/recent-upgrade-source/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Recent image-task upgrade failed' }
      - name: Upgrade public alpha.33 pending and already reviewed image candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/current-upgrade-source | Out-Null
          gh release download v0.1.0-alpha.33 --repo ax2/zinovel-studio --pattern '*-setup.exe' --pattern release-manifest.json --dir .cache/current-upgrade-source
          if ($LASTEXITCODE -ne 0) { throw 'Current public release download failed' }
          node scripts/smoke-recent-upgrade.mjs .cache/current-upgrade-source/ZiNovel-Studio-0.1.0-alpha.33-windows-x64-setup.exe .cache/current-upgrade-source/release-manifest.json current-upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Current public v1/v2 upgrade failed' }
      - name: Upgrade public alpha.35 fixed appearances and legacy material drafts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/appearance-upgrade-source | Out-Null
          gh release download v0.1.0-alpha.35 --repo ax2/zinovel-studio --pattern '*-setup.exe' --pattern release-manifest.json --dir .cache/appearance-upgrade-source
          if ($LASTEXITCODE -ne 0) { throw 'Public appearance release download failed' }
          node scripts/smoke-recent-upgrade.mjs .cache/appearance-upgrade-source/ZiNovel-Studio-0.1.0-alpha.35-windows-x64-setup.exe .cache/appearance-upgrade-source/release-manifest.json appearance-upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Fixed appearance and legacy draft upgrade failed' }
      - run: pnpm release:manifest
      - name: Upload verified preview assets as a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/ZiNovel-Studio-$version-windows-x64-setup.exe"
          gh release create "v$version" $installer release/SHA256SUMS.txt release/release-manifest.json release/runtime-inventory.json --verify-tag --draft --prerelease --title "ZiNovel Studio $version" --notes-file "iterations/releases/v$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
      - name: Publish the completed draft only after a successful upload
        if: ${{ success() && !cancelled() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$version" --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failure-evidence
          path: |
            screenshots/release/
            screenshots/stage-005/reader-cleanup-negative/
            screenshots/stage-007/publication-ui/
            screenshots/stage-007/publication-html/
            screenshots/stage-007/publication-pdf/
            screenshots/stage-007/publication-docx/
            screenshots/stage-007/publication-docx-layout/
            screenshots/stage-007/publication-resources/
            screenshots/stage-008/offline-writing/
            screenshots/stage-008/independent-backup/
            screenshots/stage-008/incremental-backup/
            screenshots/stage-008/diagnostics/
            screenshots/stage-003/model-credentials/
            screenshots/stage-003/model-profiles/
            screenshots/stage-006/image-studio/
            screenshots/stage-008/tool-isolation/
            assessments/stage-005/reader-cleanup-negative.json
            release/builder-debug.yml
            release/image-runtime-verification.json
          retention-days: 14
